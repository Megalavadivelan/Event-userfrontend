<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In</title>
    <link rel="stylesheet" href="sign-in.css">
    <script src="https://kit.fontawesome.com/042d337638.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="sign-in">
            <h2 class="h2one">Welcome back</h2>
            <h4 class="h4one">Sign-In</h4>
            <div class="detail1">
                 <input type="email" name="Email" placeholder="Enter the Email" id="email" autocomplete="new-email"><br>
                 <input type="password" name="Password" placeholder="password" id="pass" autocomplete="new-password"><br>
                 <button id="btn1">Sign-In</button>
            </div>
            
            <p class="para1">------or continue with------</p>
            <button id="google"><i class="fa-brands fa-google"></i> Continue With Google</button>
            <p>Don't have an account? <button type="button" id="btn2">Sign-Up</button></p>
        </div>
    </header>
</body>
</html>
